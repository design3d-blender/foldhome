plugins {
    id 'com.android.application'
}

android {
    namespace 'app.foldhome'
    compileSdk 36

    defaultConfig {
        applicationId 'app.foldhome'
        minSdk 31
        targetSdk 36
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
